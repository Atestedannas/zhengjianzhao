<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>证件照合规处理系统</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --bg: #f5f6fa;
  --bg2: #ffffff;
  --ink: #1a1a2e;
  --muted: #7b809a;
  --rule: #e2e8f0;
  --accent: #4f5ef7;
  --accent2: #7b5cf7;
  --success: #10b981;
  --warning: #f59e0b;
  --error: #ef4444;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --shadow: 0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --sidebar-w: 240px;
  --font: 'Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono: 'Cascadia Code','Fira Code','JetBrains Mono',monospace;
}

/* ===== Reset ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.6;min-height:100vh;display:flex}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
input,select{font-family:inherit;outline:none}

/* ===== Layout ===== */
.sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--rule);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:10;padding:24px 0}
.sidebar-logo{display:flex;align-items:center;gap:12px;padding:0 24px 24px;border-bottom:1px solid var(--rule);margin-bottom:16px}
.sidebar-logo .logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.sidebar-logo .logo-text{font-size:16px;font-weight:700;color:var(--ink)}
.sidebar-nav{flex:1;padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.sidebar-nav a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;color:var(--muted);transition:all .15s}
.sidebar-nav a:hover{background:var(--bg);color:var(--ink)}
.sidebar-nav a.active{background:linear-gradient(135deg,rgba(79,94,247,.08),rgba(123,92,247,.08));color:var(--accent);font-weight:600}
.sidebar-nav a .nav-icon{font-size:18px;width:24px;text-align:center}
.sidebar-user{padding:16px 24px;border-top:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.sidebar-user .avatar{width:36px;height:36px;border-radius:50%;background:var(--rule);display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden}
.sidebar-user .avatar img{width:100%;height:100%;object-fit:cover}
.sidebar-user .user-name{font-size:13px;font-weight:600;color:var(--ink);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-user .user-badge{font-size:11px;color:var(--muted)}

.main{flex:1;margin-left:var(--sidebar-w);padding:32px;max-width:1100px;width:calc(100% - var(--sidebar-w))}
.page-header{margin-bottom:32px}
.page-header h1{font-size:28px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
.page-header p{font-size:14px;color:var(--muted);margin-top:4px}

/* ===== Cards ===== */
.card{background:var(--bg2);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow);margin-bottom:20px}
.card-title{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* ===== Steps ===== */
.steps{display:flex;align-items:center;gap:0;margin-bottom:28px;background:var(--bg2);border-radius:var(--radius-lg);padding:16px 24px;box-shadow:var(--shadow)}
.step{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:500}
.step .step-num{width:28px;height:28px;border-radius:50%;background:var(--rule);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;transition:all .3s}
.step.active .step-num{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 2px 8px rgba(79,94,247,.3)}
.step.done .step-num{background:var(--success);color:#fff}
.step.active{color:var(--accent);font-weight:700}
.step.done{color:var(--success)}
.step-conn{flex:1;height:2px;background:var(--rule);margin:0 4px;border-radius:1px;overflow:hidden}
.step-conn .fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease;width:0}
.step-conn.done .fill{width:100%}

/* ===== Upload Zone ===== */
.upload-zone{border:2px dashed var(--rule);border-radius:var(--radius-lg);padding:48px;text-align:center;cursor:pointer;transition:all .2s;background:var(--bg2)}
.upload-zone:hover{border-color:var(--accent);background:rgba(79,94,247,.02)}
.upload-zone .upload-icon{font-size:48px;margin-bottom:12px;display:block}
.upload-zone .upload-title{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:4px}
.upload-zone .upload-desc{font-size:13px;color:var(--muted)}
.upload-zone.has-image{padding:0;border-style:solid;border-color:var(--rule);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;background:#f0f0f0;min-height:300px}
.upload-zone.has-image img{max-width:100%;max-height:400px;display:block;object-fit:contain}
.upload-zone.has-image .reupload-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.6));padding:24px 16px 16px;display:flex;justify-content:center;opacity:0;transition:opacity .2s}
.upload-zone.has-image:hover .reupload-overlay{opacity:1}
.upload-zone.has-image .reupload-btn{background:rgba(255,255,255,.9);color:var(--ink);padding:8px 20px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.upload-zone.has-image .reupload-btn:hover{background:#fff;transform:translateY(-1px)}
.upload-zone-wrap{position:relative}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 24px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;transition:all .2s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 12px rgba(79,94,247,.25)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(79,94,247,.35)}
.btn-primary:active{transform:translateY(0)}
.btn-secondary{background:var(--bg2);color:var(--ink);border:1px solid var(--rule)}
.btn-secondary:hover{background:var(--bg);border-color:var(--muted)}
.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn-outline:hover{background:rgba(79,94,247,.05)}
.btn-danger{background:var(--error);color:#fff}
.btn-lg{padding:14px 32px;font-size:16px;border-radius:var(--radius)}
.btn-block{width:100%}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-group{display:flex;gap:12px;margin-top:20px}

/* ===== Template Grid ===== */
.template-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.template-item{padding:16px;border:2px solid var(--rule);border-radius:var(--radius);cursor:pointer;transition:all .2s;background:var(--bg2);position:relative}
.template-item:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.template-item.selected{border-color:var(--accent);background:linear-gradient(135deg,rgba(79,94,247,.04),rgba(123,92,247,.04));box-shadow:0 0 0 1px var(--accent)}
.template-item .tpl-name{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px}
.template-item .tpl-spec{font-size:12px;color:var(--accent);font-weight:600}
.template-item .tpl-desc{font-size:12px;color:var(--muted);margin-top:4px}

/* Custom size card */
.template-item.custom-card .custom-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:10px;text-align:center}
.template-item.custom-card .custom-inputs{display:flex;align-items:center;justify-content:center;gap:6px}
.template-item.custom-card .custom-inputs input{width:65px;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;font-size:13px;text-align:center;font-weight:600;color:var(--ink);background:var(--bg);transition:border-color .2s}
.template-item.custom-card .custom-inputs input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(79,94,247,.1);outline:none}
.template-item.custom-card .custom-inputs input:invalid{border-color:var(--error)}
.template-item.custom-card .custom-inputs .sep{font-size:14px;color:var(--muted);font-weight:500}
.template-item.custom-card .custom-inputs .unit{font-size:11px;color:var(--muted);font-weight:500}
.template-item.custom-card.selected .custom-inputs input{border-color:var(--accent);background:rgba(79,94,247,.04)}

/* ===== Color Picker ===== */
.color-options{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.color-opt{width:36px;height:36px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .2s;position:relative}
.color-opt:hover{transform:scale(1.1)}
.color-opt.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg2),0 0 0 4px var(--accent)}

/* ===== Result ===== */
.result-container{display:flex;gap:24px;align-items:flex-start}
.result-preview{flex-shrink:0;max-width:400px}
.result-preview img{width:100%;border-radius:var(--radius);box-shadow:var(--shadow-md)}
.result-meta{flex:1;min-width:0}
.meta-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.meta-label{color:var(--muted)}
.meta-value{font-weight:600;color:var(--ink)}

/* ===== History ===== */
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item{display:flex;align-items:center;gap:16px;padding:16px;background:var(--bg2);border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer;transition:all .2s}
.history-item:hover{transform:translateX(4px);box-shadow:var(--shadow-md)}
.history-item .thumb{width:60px;height:80px;border-radius:var(--radius-sm);background:var(--rule);overflow:hidden;flex-shrink:0}
.history-item .thumb img{width:100%;height:100%;object-fit:cover}
.history-info{flex:1;min-width:0}
.history-info .h-name{font-size:14px;font-weight:700;color:var(--ink)}
.history-info .h-meta{font-size:12px;color:var(--muted);margin-top:2px}
.history-info .h-time{font-size:12px;color:var(--muted)}

/* ===== Stat Cards ===== */
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{padding:20px;background:var(--bg2);border-radius:var(--radius-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.stat-card .stat-icon{font-size:28px}
.stat-card .stat-value{font-size:32px;font-weight:800;color:var(--accent)}
.stat-card .stat-label{font-size:13px;color:var(--muted);font-weight:500}

/* ===== Login ===== */
.login-card{max-width:400px;margin:60px auto;text-align:center}
.login-card .tab-btns{display:flex;gap:0;margin-bottom:24px;background:var(--bg);border-radius:var(--radius);padding:4px}
.login-card .tab-btn{flex:1;padding:10px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;color:var(--muted);transition:all .2s;background:transparent}
.login-card .tab-btn.active{background:var(--bg2);color:var(--ink);box-shadow:var(--shadow)}
.qrcode-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px}
.qrcode-wrap canvas{border:2px solid var(--rule);border-radius:var(--radius)}
.login-status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.login-status .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .2s}
.modal{background:var(--bg2);border-radius:var(--radius-lg);padding:32px;max-width:480px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.15);animation:slideUp .3s}
.modal h3{font-size:20px;font-weight:700;margin-bottom:16px}
.modal p{font-size:14px;color:var(--muted);margin-bottom:20px}
.modal .btn-group{justify-content:flex-end}

/* ===== Loading ===== */
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px}
.spinner{width:40px;height:40px;border:3px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}}

/* ===== Toast ===== */
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:200;padding:12px 24px;background:var(--ink);color:#fff;border-radius:var(--radius);font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:slideUp .3s;pointer-events:none}

/* ===== Form ===== */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
.form-input,.form-select{width:100%;padding:10px 14px;border:1px solid var(--rule);border-radius:var(--radius-sm);font-size:14px;background:var(--bg2);transition:border-color .2s}
.form-input:focus,.form-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,94,247,.1)}
.form-row{display:flex;gap:12px}
.form-row>*{flex:1}
.form-hint{font-size:12px;color:var(--muted);margin-top:4px}

/* ===== Chips & Toggles ===== */
.chip-group{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;background:var(--bg);border:1px solid var(--rule);color:var(--muted);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.beauty-toggles{display:flex;gap:8px}
.beauty-tgl{flex:1;text-align:center;padding:8px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;background:var(--bg);border:1px solid var(--rule);color:var(--muted);cursor:pointer;transition:all .15s}
.beauty-tgl:hover{border-color:var(--accent);color:var(--accent)}
.beauty-tgl.active{background:rgba(79,94,247,.08);color:var(--accent);font-weight:700;border-color:var(--accent)}

/* ===== Mode Tabs ===== */
.mode-tabs{display:flex;background:var(--bg);border-radius:var(--radius);padding:4px;margin-bottom:20px}
.mode-tab{flex:1;text-align:center;padding:10px 0;font-size:14px;font-weight:500;color:var(--muted);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s}
.mode-tab.active{background:var(--bg2);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}

/* ===== Section Title ===== */
.section-title{font-size:14px;font-weight:700;color:var(--ink);margin:20px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--rule)}

/* ===== Payment ===== */
.pay-modal .pay-amount{font-size:36px;font-weight:800;color:var(--accent);text-align:center;margin:12px 0}

/* ===== Empty State ===== */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .empty-icon{font-size:48px;margin-bottom:12px;display:block}
.empty .empty-title{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:4px}
.empty .empty-desc{font-size:13px;color:var(--muted)}

/* ===== Tools ===== */
.hidden{display:none!important}
.flex{display:flex;align-items:center;gap:8px}
.gap-12{gap:12px}
.mt-12{margin-top:12px}
.mt-20{margin-top:20px}
.mb-20{margin-bottom:20px}
.text-center{text-align:center}
.text-muted{color:var(--muted);font-size:13px}
.text-sm{font-size:13px}

/* ================================================================
   CROPPER — Windows Screenshot Style
   ================================================================ */
.cropper-wrap{background:var(--bg2);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);margin-bottom:20px}
.cropper-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--rule);gap:12px}
.cropper-toolbar .toolbar-left{display:flex;align-items:center;gap:12px}
.cropper-toolbar .toolbar-right{display:flex;align-items:center;gap:8px}
.cropper-toolbar .zoom-label{font-size:12px;color:var(--muted);white-space:nowrap}
.cropper-toolbar .zoom-val{font-size:13px;font-weight:700;color:var(--accent);min-width:42px;text-align:center}
.cropper-toolbar input[type=range]{width:120px;accent-color:var(--accent)}
.cropper-toolbar .btn-sm{padding:5px 12px;font-size:12px;border-radius:6px}

/* Crop area: dark background */
.crop-area{position:relative;display:flex;justify-content:center;align-items:center;min-height:420px;background:#1a1a2e;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:crosshair}
.crop-area.moving{cursor:move}
.crop-area.resizing-nw,.crop-area.resizing-se{cursor:nwse-resize}
.crop-area.resizing-ne,.crop-area.resizing-sw{cursor:nesw-resize}
.crop-area.resizing-n,.crop-area.resizing-s{cursor:ns-resize}
.crop-area.resizing-e,.crop-area.resizing-w{cursor:ew-resize}

/* Canvas wrapper: centers the image */
.crop-canvas-wrap{position:relative;display:inline-block;line-height:0}
.crop-canvas-wrap canvas{display:block;max-width:100%}

/* Overlay: 4 dark rectangles around the crop selection */
.crop-overlay-part{position:absolute;background:rgba(0,0,0,.55);pointer-events:none;z-index:2}

/* Crop selection rectangle */
.crop-rect{position:absolute;z-index:3;pointer-events:none}
.crop-rect-border{position:absolute;inset:0;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.2),inset 0 0 0 1px rgba(0,0,0,.2)}
.crop-rect-grid{position:absolute;inset:0;pointer-events:none}
.crop-rect-grid .grid-line{position:absolute;background:rgba(255,255,255,.12)}
.crop-rect-grid .grid-h1{left:0;right:0;top:33.33%;height:1px}
.crop-rect-grid .grid-h2{left:0;right:0;top:66.66%;height:1px}
.crop-rect-grid .grid-v1{top:0;bottom:0;left:33.33%;width:1px}
.crop-rect-grid .grid-v2{top:0;bottom:0;left:66.66%;width:1px}

/* 8 resize handles */
.crop-handle{position:absolute;width:12px;height:12px;background:#fff;border:2px solid var(--accent);z-index:4;pointer-events:auto;border-radius:2px;transition:transform .1s}
.crop-handle:hover{transform:scale(1.3)}
.crop-handle.nw{top:-6px;left:-6px;cursor:nwse-resize}
.crop-handle.ne{top:-6px;right:-6px;cursor:nesw-resize}
.crop-handle.sw{bottom:-6px;left:-6px;cursor:nesw-resize}
.crop-handle.se{bottom:-6px;right:-6px;cursor:nwse-resize}
.crop-handle.n{top:-6px;left:50%;margin-left:-6px;cursor:ns-resize}
.crop-handle.s{bottom:-6px;left:50%;margin-left:-6px;cursor:ns-resize}
.crop-handle.w{top:50%;left:-6px;margin-top:-6px;cursor:ew-resize}
.crop-handle.e{top:50%;right:-6px;margin-top:-6px;cursor:ew-resize}

/* Size label */
.crop-size-label{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;font-size:11px;padding:3px 10px;border-radius:4px;white-space:nowrap;font-family:var(--font-mono);pointer-events:none;z-index:5}

/* Crop info bar */
.crop-info-bar{display:flex;justify-content:center;gap:32px;padding:10px 16px;font-size:12px;color:var(--muted);font-family:var(--font-mono);border-top:1px solid var(--rule)}
.crop-info-bar span{color:var(--accent);font-weight:600}

/* ===== Responsive ===== */
@media(max-width:768px){
  .sidebar{display:none}
  .main{margin-left:0;width:100%;padding:16px}
  .result-container{flex-direction:column}
  .result-preview{max-width:100%}
  .stat-cards{grid-template-columns:1fr}
  .template-grid{grid-template-columns:repeat(2,1fr)}
  .crop-area{min-height:300px}
  .cropper-toolbar{flex-wrap:wrap}
}
@media(max-width:480px){
  .template-grid{grid-template-columns:1fr}
}
</style>
</head>

/* ===== UTILS ===== */
function $(sel){return document.querySelector(sel)}
function $$(sel){return document.querySelectorAll(sel)}
function toast(msg,ms=2500){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(function(){t.classList.add('hidden')},ms)}
function showModal(html){$('#modal-content').innerHTML=html;$('#modal-overlay').classList.remove('hidden')}
function hideModal(){$('#modal-overlay').classList.add('hidden')}
$('#modal-overlay').addEventListener('click',function(e){if(e.target===this)hideModal()})

async function api(path,opts){
  opts=opts||{};
  const headers=opts.headers||{};
  if(state.token)headers['Authorization']='Bearer '+state.token;
  if(!(opts.body instanceof FormData))headers['Content-Type']='application/json';
  const res=await fetch(API+path,Object.assign({},opts,{headers:headers}));
  if(res.status===401&&state.refreshToken){
    try{
      const r=await fetch(API+'/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:state.refreshToken})});
      if(r.ok){const d=await r.json();state.token=d.access_token;state.refreshToken=d.refresh_token;localStorage.setItem(TOKEN_KEY,d.access_token);localStorage.setItem(REFRESH_KEY,d.refresh_token);headers['Authorization']='Bearer '+d.access_token;return fetch(API+path,Object.assign({},opts,{headers:headers}))}
    }catch(e){}
    state.token='';state.refreshToken='';localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(REFRESH_KEY);state.user=null;renderAll()
  }
  return res;
}

/* ===== ROUTING ===== */
function navigate(page){
  if(page!=='login'&&!state.token){
    navigate('login');

  state.currentPage=page;
  $$('.sidebar-nav a').forEach(function(a){a.classList.toggle('active',a.dataset.page===page)});
  $$('#main-content>div').forEach(function(d){d.classList.add('hidden')});
  var target=$('#page-'+page);
  if(target)target.classList.remove('hidden');

  else if(page==='history')renderHistory();
  else if(page==='profile')renderProfile();
  else if(page==='login')renderLogin();
}
$$('.sidebar-nav a').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();navigate(this.dataset.page)})});

/* ===== AUTH ===== */

  try{var r=await api('/user/profile');if(r.ok){var d=await r.json();state.user=d.data||d;updateSidebar()}else{state.user=null;updateSidebar()}}catch(e){state.user=null;updateSidebar()}
}
async function fetchFreeCount(){
  try{var r=await api('/user/free-count');if(r.ok){var d=await r.json();state.freeCount=d.data&&d.data.free_count!==undefined?d.data.free_count:(d.data&&d.data.count!==undefined?d.data.count:0);updateSidebar()}}catch(e){}

/* ===== UPLOAD ===== */
function bindUpload(){
  var zone=$('#upload-zone');
  if(!zone)return;

  function triggerUpload(){
    var input=document.createElement('input');
    input.type='file';input.accept='image/jpeg,image/png,image/webp,image/bmp';
    input.onchange=function(e){
      var file=e.target.files[0];
      if(!file)return;
      if(file.size>10*1024*1024){toast('文件大小不能超过 10MB');return}
      state.originalFile=file;
      state.croppedDataUrl=null;
      state.step=0;
      var reader=new FileReader();
      reader.onload=function(ev){state.originalDataUrl=ev.target.result;renderHome()};
      reader.readAsDataURL(file);
    };
    input.click();
  }

  zone.addEventListener('click',function(e){
    // Don't trigger if clicking the reupload button (handled separately)
    if(e.target.closest('.reupload-btn'))return;
    triggerUpload();
  });

  // Reupload button
  var reuploadBtn=zone.querySelector('.reupload-btn');
  if(reuploadBtn){
    reuploadBtn.addEventListener('click',function(e){
      e.stopPropagation();
      triggerUpload();
    });
  }
}

/* ================================================================
   INTERACTIVE CROPPER — Windows Screenshot Style
   ================================================================ */
var cropState = {
  img: null,
  imgNaturalW: 0,
  imgNaturalH: 0,
  canvasW: 0,
  canvasH: 0,
  canvasX: 0,
  canvasY: 0,
  zoom: 1,
  rect: { x: 0, y: 0, w: 0, h: 0 },
  dragging: null,        // null | 'create' | 'move' | 'resize-nw' | 'resize-n' | ...
  dragStart: { x: 0, y: 0 },
  origRect: null,
  minSize: 10,
  areaW: 0,
  areaH: 0,
};

function initCropper(){
  var canvas = $('#crop-canvas');
  var area = $('#crop-area');
  if (!canvas || !area) return;

  var img = new Image();
  img.onload = function() {
    cropState.img = img;
    cropState.imgNaturalW = img.naturalWidth;
    cropState.imgNaturalH = img.naturalHeight;

    // Calculate initial fit
    area.style.position = 'relative';
    cropState.areaW = area.clientWidth;
    cropState.areaH = area.clientHeight;

    var maxW = cropState.areaW - 48;
    var maxH = Math.min(500, cropState.areaH - 48);
    var sc = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
    cropState.zoom = sc;
    cropState.canvasW = Math.round(img.naturalWidth * sc);
    cropState.canvasH = Math.round(img.naturalHeight * sc);
    cropState.canvasX = Math.round((cropState.areaW - cropState.canvasW) / 2);
    cropState.canvasY = Math.round((cropState.areaH - cropState.canvasH) / 2);

    // Set canvas
    canvas.width = cropState.canvasW;
    canvas.height = cropState.canvasH;
    canvas.style.width = cropState.canvasW + 'px';
    canvas.style.height = cropState.canvasH + 'px';

    var wrap = $('#crop-canvas-wrap');
    wrap.style.position = 'absolute';
    wrap.style.left = cropState.canvasX + 'px';
    wrap.style.top = cropState.canvasY + 'px';

    // Draw image
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, cropState.canvasW, cropState.canvasH);

    // Update zoom slider
    var slider = $('#crop-zoom-slider');
    if (slider) slider.value = Math.round(cropState.zoom * 100);
    $('#crop-zoom-val').textContent = Math.round(cropState.zoom * 100) + '%';
    $('#crop-info-zoom').textContent = Math.round(cropState.zoom * 100) + '%';

    // Reset crop rect
    cropState.rect = { x: 0, y: 0, w: 0, h: 0 };
    cropState.dragging = null;
    updateOverlay();
    updateCropRect();
    updateCropInfo();

    bindCropEvents();
  };
  img.src = state.croppedDataUrl || state.originalDataUrl;
}

function bindCropEvents(){
  var area = $('#crop-area');
  if (!area) return;

  function getPos(e) {
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    var ar = area.getBoundingClientRect();
    return { x: clientX - ar.left, y: clientY - ar.top };
  }

  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  // ----- Mouse Down -----
  area.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return; // Only left button
    var pos = getPos(e);
    var r = cropState.rect;
    var cx = cropState.canvasX, cy = cropState.canvasY;
    var cw = cropState.canvasW, ch = cropState.canvasH;

    // Check if clicking on a handle
    var handle = e.target.closest('.crop-handle');
    if (handle && r.w > 0 && r.h > 0) {
      var hName = handle.dataset.handle;
      cropState.dragging = 'resize-' + hName;
      cropState.dragStart = { x: pos.x, y: pos.y };
      cropState.origRect = { x: r.x, y: r.y, w: r.w, h: r.h };
      updateCursor(hName);
      e.preventDefault();
      return;
    }

    // Check if clicking inside existing rect (move)
    if (r.w > 0 && r.h > 0 && pos.x >= r.x && pos.x <= r.x + r.w && pos.y >= r.y && pos.y <= r.y + r.h) {
      cropState.dragging = 'move';
      cropState.dragStart = { x: pos.x, y: pos.y };
      cropState.origRect = { x: r.x, y: r.y, w: r.w, h: r.h };
      area.classList.add('moving');
      e.preventDefault();
      return;
    }

    // Check if clicking on canvas area (start new rect)
    if (pos.x >= cx && pos.x <= cx + cw && pos.y >= cy && pos.y <= cy + ch) {
      cropState.dragging = 'create';
      cropState.dragStart = { x: clamp(pos.x, cx, cx + cw), y: clamp(pos.y, cy, cy + ch) };
      cropState.rect = { x: cropState.dragStart.x, y: cropState.dragStart.y, w: 0, h: 0 };
      cropState.origRect = null;
      updateOverlay();
      updateCropRect();
      e.preventDefault();
      return;
    }
  });

  // ----- Mouse Move -----
  document.addEventListener('mousemove', function(e) {
    if (!cropState.dragging) {
      // Update cursor based on hover position
      updateHoverCursor(e);
      return;
    }
    e.preventDefault();
    var pos = getPos(e);
    var r = cropState.rect;
    var cx = cropState.canvasX, cy = cropState.canvasY;
    var cw = cropState.canvasW, ch = cropState.canvasH;

    if (cropState.dragging === 'create') {
      var x1 = cropState.dragStart.x, y1 = cropState.dragStart.y;
      var x2 = clamp(pos.x, cx, cx + cw), y2 = clamp(pos.y, cy, cy + ch);
      cropState.rect = {
        x: Math.min(x1, x2),
        y: Math.min(y1, y2),
        w: Math.abs(x2 - x1),
        h: Math.abs(y2 - y1)
      };
    } else if (cropState.dragging === 'move') {
      var o = cropState.origRect;
      var dx = pos.x - cropState.dragStart.x;
      var dy = pos.y - cropState.dragStart.y;
      var nx = clamp(o.x + dx, cx, cx + cw - o.w);
      var ny = clamp(o.y + dy, cy, cy + ch - o.h);
      cropState.rect = { x: nx, y: ny, w: o.w, h: o.h };
    } else if (cropState.dragging && cropState.dragging.indexOf('resize-') === 0) {
      var handle = cropState.dragging.replace('resize-', '');
      var o = cropState.origRect;
      var dx = pos.x - cropState.dragStart.x;
      var dy = pos.y - cropState.dragStart.y;
      var nr = { x: o.x, y: o.y, w: o.w, h: o.h };

      if (handle.indexOf('e') !== -1) {
        nr.w = clamp(o.w + dx, cropState.minSize, cx + cw - o.x);
      }
      if (handle.indexOf('w') !== -1) {
        var nw = clamp(o.w - dx, cropState.minSize, o.x + o.w - cx);
        nr.x = o.x + o.w - nw;
        nr.w = nw;
      }
      if (handle.indexOf('s') !== -1) {
        nr.h = clamp(o.h + dy, cropState.minSize, cy + ch - o.y);
      }
      if (handle.indexOf('n') !== -1) {
        var nh = clamp(o.h - dy, cropState.minSize, o.y + o.h - cy);
        nr.y = o.y + o.h - nh;
        nr.h = nh;
      }
      cropState.rect = nr;
    }

    updateOverlay();
    updateCropRect();
    updateCropInfo();
  });

  // ----- Mouse Up -----
  document.addEventListener('mouseup', function() {
    if (cropState.dragging) {
      if (cropState.rect.w < cropState.minSize || cropState.rect.h < cropState.minSize) {
        cropState.rect = { x: 0, y: 0, w: 0, h: 0 };
      }
      cropState.dragging = null;
      cropState.origRect = null;
      area.classList.remove('moving');
      area.className = area.className.replace(/resizing-\w+/g, '').replace(/\s+/g, ' ').trim();
      updateOverlay();
      updateCropRect();
      updateCropInfo();
      updateBtnState();
    }
  });

  // Touch events
  area.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      var pos = getPos(e);
      var r = cropState.rect;

      var handle = e.target.closest('.crop-handle');
      if (handle && r.w > 0 && r.h > 0) {
        cropState.dragging = 'resize-' + handle.dataset.handle;
        cropState.dragStart = { x: pos.x, y: pos.y };
        cropState.origRect = { x: r.x, y: r.y, w: r.w, h: r.h };
        e.preventDefault();
        return;
      }

      if (r.w > 0 && r.h > 0 && pos.x >= r.x && pos.x <= r.x + r.w && pos.y >= r.y && pos.y <= r.y + r.h) {
        cropState.dragging = 'move';
        cropState.dragStart = { x: pos.x, y: pos.y };
        cropState.origRect = { x: r.x, y: r.y, w: r.w, h: r.h };
        e.preventDefault();
        return;
      }

      var cx = cropState.canvasX, cy = cropState.canvasY;
      var cw = cropState.canvasW, ch = cropState.canvasH;
      if (pos.x >= cx && pos.x <= cx + cw && pos.y >= cy && pos.y <= cy + ch) {
        cropState.dragging = 'create';
        cropState.dragStart = { x: clamp(pos.x, cx, cx + cw), y: clamp(pos.y, cy, cy + ch) };
        cropState.rect = { x: cropState.dragStart.x, y: cropState.dragStart.y, w: 0, h: 0 };
        cropState.origRect = null;
        updateOverlay();
        updateCropRect();
        e.preventDefault();
      }
    }
  }, { passive: false });

  document.addEventListener('touchmove', function(e) {
    if (!cropState.dragging) return;
    // Same logic as mousemove
    var pos = getPos(e);
    var cx = cropState.canvasX, cy = cropState.canvasY;
    var cw = cropState.canvasW, ch = cropState.canvasH;

    if (cropState.dragging === 'create') {
      var x1 = cropState.dragStart.x, y1 = cropState.dragStart.y;
      var x2 = clamp(pos.x, cx, cx + cw), y2 = clamp(pos.y, cy, cy + ch);
      cropState.rect = { x: Math.min(x1, x2), y: Math.min(y1, y2), w: Math.abs(x2 - x1), h: Math.abs(y2 - y1) };
    } else if (cropState.dragging === 'move') {
      var o = cropState.origRect;
      var dx = pos.x - cropState.dragStart.x, dy = pos.y - cropState.dragStart.y;
      cropState.rect = { x: clamp(o.x + dx, cx, cx + cw - o.w), y: clamp(o.y + dy, cy, cy + ch - o.h), w: o.w, h: o.h };
    } else if (cropState.dragging && cropState.dragging.indexOf('resize-') === 0) {
      var handle = cropState.dragging.replace('resize-', '');
      var o = cropState.origRect;
      var dx = pos.x - cropState.dragStart.x, dy = pos.y - cropState.dragStart.y;
      var nr = { x: o.x, y: o.y, w: o.w, h: o.h };
      if (handle.indexOf('e') !== -1) nr.w = clamp(o.w + dx, cropState.minSize, cx + cw - o.x);
      if (handle.indexOf('w') !== -1) { var nw = clamp(o.w - dx, cropState.minSize, o.x + o.w - cx); nr.x = o.x + o.w - nw; nr.w = nw; }
      if (handle.indexOf('s') !== -1) nr.h = clamp(o.h + dy, cropState.minSize, cy + ch - o.y);
      if (handle.indexOf('n') !== -1) { var nh = clamp(o.h - dy, cropState.minSize, o.y + o.h - cy); nr.y = o.y + o.h - nh; nr.h = nh; }
      cropState.rect = nr;
    }
    updateOverlay();
    updateCropRect();
    updateCropInfo();
  }, { passive: false });

  document.addEventListener('touchend', function() {
    if (cropState.dragging) {
      if (cropState.rect.w < cropState.minSize || cropState.rect.h < cropState.minSize) {
        cropState.rect = { x: 0, y: 0, w: 0, h: 0 };
      }
      cropState.dragging = null;
      cropState.origRect = null;
      updateOverlay();
      updateCropRect();
      updateCropInfo();
      updateBtnState();
    }
  });
}

function updateHoverCursor(e) {
  var area = $('#crop-area');
  if (!area || cropState.dragging) return;
  var ar = area.getBoundingClientRect();
  var pos = { x: e.clientX - ar.left, y: e.clientY - ar.top };
  var r = cropState.rect;

  if (r.w > 0 && r.h > 0) {
    // Check handles
    var handleSize = 8;
    var handles = [
      { n: 'nw', x: r.x - handleSize, y: r.y - handleSize, w: handleSize * 2, h: handleSize * 2 },
      { n: 'ne', x: r.x + r.w - handleSize, y: r.y - handleSize, w: handleSize * 2, h: handleSize * 2 },
      { n: 'sw', x: r.x - handleSize, y: r.y + r.h - handleSize, w: handleSize * 2, h: handleSize * 2 },
      { n: 'se', x: r.x + r.w - handleSize, y: r.y + r.h - handleSize, w: handleSize * 2, h: handleSize * 2 },
      { n: 'n', x: r.x + r.w / 2 - handleSize, y: r.y - handleSize, w: handleSize * 2, h: handleSize * 2 },
      { n: 's', x: r.x + r.w / 2 - handleSize, y: r.y + r.h - handleSize, w: handleSize * 2, h: handleSize * 2 },
      { n: 'w', x: r.x - handleSize, y: r.y + r.h / 2 - handleSize, w: handleSize * 2, h: handleSize * 2 },
      { n: 'e', x: r.x + r.w - handleSize, y: r.y + r.h / 2 - handleSize, w: handleSize * 2, h: handleSize * 2 },
    ];
    for (var i = 0; i < handles.length; i++) {
      var h = handles[i];
      if (pos.x >= h.x && pos.x <= h.x + h.w && pos.y >= h.y && pos.y <= h.y + h.h) {
        updateCursor(h.n);
        return;
      }
    }
    // Inside rect
    if (pos.x >= r.x && pos.x <= r.x + r.w && pos.y >= r.y && pos.y <= r.y + r.h) {
      area.style.cursor = 'move';
      return;
    }
  }
  // Default: crosshair over canvas, default elsewhere
  var cx = cropState.canvasX, cy = cropState.canvasY;
  var cw = cropState.canvasW, ch = cropState.canvasH;
  if (pos.x >= cx && pos.x <= cx + cw && pos.y >= cy && pos.y <= cy + ch) {
    area.style.cursor = 'crosshair';
  } else {
    area.style.cursor = 'default';
  }
}

function updateCursor(handle) {
  var area = $('#crop-area');
  if (!area) return;
  area.className = area.className.replace(/resizing-\w+/g, '').replace(/\s+/g, ' ').trim();
  if (handle === 'nw' || handle === 'se') area.classList.add('resizing-nw');
  else if (handle === 'ne' || handle === 'sw') area.classList.add('resizing-ne');
  else if (handle === 'n' || handle === 's') area.classList.add('resizing-n');
  else if (handle === 'e' || handle === 'w') area.classList.add('resizing-e');
}

function updateOverlay() {
  var r = cropState.rect;
  var top = $('#crop-overlay-top');
  var bottom = $('#crop-overlay-bottom');
  var left = $('#crop-overlay-left');
  var right = $('#crop-overlay-right');
  if (!top || !bottom || !left || !right) return;

  if (r.w > 0 && r.h > 0) {
    top.style.display = 'block';
    bottom.style.display = 'block';
    left.style.display = 'block';
    right.style.display = 'block';

    top.style.left = '0px';
    top.style.top = '0px';
    top.style.width = cropState.areaW + 'px';
    top.style.height = r.y + 'px';

    bottom.style.left = '0px';
    bottom.style.top = (r.y + r.h) + 'px';
    bottom.style.width = cropState.areaW + 'px';
    bottom.style.height = (cropState.areaH - r.y - r.h) + 'px';

    left.style.left = '0px';
    left.style.top = r.y + 'px';
    left.style.width = r.x + 'px';
    left.style.height = r.h + 'px';

    right.style.left = (r.x + r.w) + 'px';
    right.style.top = r.y + 'px';
    right.style.width = (cropState.areaW - r.x - r.w) + 'px';
    right.style.height = r.h + 'px';
  } else {
    top.style.display = 'none';
    bottom.style.display = 'none';
    left.style.display = 'none';
    right.style.display = 'none';
  }
}

function updateCropRect() {
  var rect = $('#crop-rect');
  var label = $('#crop-size-label');
  if (!rect) return;

  var r = cropState.rect;
  if (r.w > 0 && r.h > 0) {
    rect.style.display = 'block';
    rect.style.left = r.x + 'px';
    rect.style.top = r.y + 'px';
    rect.style.width = r.w + 'px';
    rect.style.height = r.h + 'px';
    if (label) label.textContent = Math.round(r.w) + ' x ' + Math.round(r.h) + ' px';
  } else {
    rect.style.display = 'none';
  }
}

function updateCropInfo() {
  var r = cropState.rect;
  var isz = $('#crop-info-size');
  var ir = $('#crop-info-ratio');
  if (isz) isz.textContent = r.w > 0 ? Math.round(r.w) + ' x ' + Math.round(r.h) + ' px' : '-';
  if (ir) ir.textContent = r.w > 0 && r.h > 0 ? (r.w / r.h).toFixed(2) + ':1' : '自由';
}

function updateBtnState() {
  var btn = $('#btn-confirm-crop');
  if (btn) btn.disabled = !(cropState.rect.w >= cropState.minSize && cropState.rect.h >= cropState.minSize);
}

/* ===== Zoom ===== */
function onCropZoom(val) {
  var pct = parseInt(val) / 100;
  if (!cropState.img) return;

  var oldZoom = cropState.zoom;
  var newZoom = pct;
  cropState.zoom = newZoom;

  // Recalculate canvas size
  cropState.canvasW = Math.round(cropState.imgNaturalW * newZoom);
  cropState.canvasH = Math.round(cropState.imgNaturalH * newZoom);
  cropState.canvasX = Math.round((cropState.areaW - cropState.canvasW) / 2);
  cropState.canvasY = Math.round((cropState.areaH - cropState.canvasH) / 2);

  // Update canvas
  var canvas = $('#crop-canvas');
  canvas.width = cropState.canvasW;
  canvas.height = cropState.canvasH;
  canvas.style.width = cropState.canvasW + 'px';
  canvas.style.height = cropState.canvasH + 'px';

  var wrap = $('#crop-canvas-wrap');
  wrap.style.left = cropState.canvasX + 'px';
  wrap.style.top = cropState.canvasY + 'px';

  var ctx = canvas.getContext('2d');
  ctx.drawImage(cropState.img, 0, 0, cropState.canvasW, cropState.canvasH);

  // Scale crop rect proportionally
  if (cropState.rect.w > 0 && cropState.rect.h > 0) {
    var scale = newZoom / oldZoom;
    var r = cropState.rect;
    var cx = cropState.canvasX, cy = cropState.canvasY;
    var cw = cropState.canvasW, ch = cropState.canvasH;

    // Scale rect around center
    var centerX = r.x + r.w / 2;
    var centerY = r.y + r.h / 2;
    var newW = r.w * scale;
    var newH = r.h * scale;
    var newX = centerX * scale + (cropState.canvasX - cropState.canvasX * scale / scale);
    // Simpler: scale relative to canvas origin
    newX = r.x * scale + cropState.canvasX * (1 - scale / (oldZoom / newZoom));
    // Actually simplest: just scale from the old canvas position
    newX = (r.x - cropState.canvasX) * scale + cropState.canvasX;
    newY = (r.y - cropState.canvasY) * scale + cropState.canvasY;

    // Clamp
    newX = Math.max(cx, newX);
    newY = Math.max(cy, newY);
    newW = Math.min(newW, cx + cw - newX);
    newH = Math.min(newH, cy + ch - newY);

    if (newW >= cropState.minSize && newH >= cropState.minSize) {
      cropState.rect = { x: newX, y: newY, w: newW, h: newH };
    } else {
      cropState.rect = { x: 0, y: 0, w: 0, h: 0 };
    }
  }

  // Update UI
  $('#crop-zoom-val').textContent = Math.round(newZoom * 100) + '%';
  $('#crop-info-zoom').textContent = Math.round(newZoom * 100) + '%';
  updateOverlay();
  updateCropRect();
  updateCropInfo();
  updateBtnState();
}

function resetCrop() {
  cropState.rect = { x: 0, y: 0, w: 0, h: 0 };
  cropState.dragging = null;
  updateOverlay();
  updateCropRect();
  updateCropInfo();
  updateBtnState();
}

function confirmCrop() {
  var r = cropState.rect;
  if (!r || r.w < cropState.minSize || r.h < cropState.minSize) {
    toast('请先在图片上拖拽选择裁剪区域');
    return;
  }

  // Convert crop rect coordinates to original image coordinates
  var scaleX = cropState.imgNaturalW / cropState.canvasW;
  var scaleY = cropState.imgNaturalH / cropState.canvasH;
  var sx = (r.x - cropState.canvasX) * scaleX;
  var sy = (r.y - cropState.canvasY) * scaleY;
  var sw = r.w * scaleX;
  var sh = r.h * scaleY;

  // Clamp to image bounds
  sx = Math.max(0, sx);
  sy = Math.max(0, sy);
  sw = Math.min(sw, cropState.imgNaturalW - sx);
  sh = Math.min(sh, cropState.imgNaturalH - sy);

  var out = document.createElement('canvas');
  out.width = Math.round(sw);
  out.height = Math.round(sh);
  var ctx = out.getContext('2d');
  ctx.drawImage(cropState.img, sx, sy, sw, sh, 0, 0, sw, sh);

  state.croppedDataUrl = out.toDataURL('image/jpeg', 0.92);
  state.step = 2;
  toast('裁剪完成');
  renderHome();
}

/* ===== TEMPLATES ===== */
async function loadTemplates(){
  try{
    var r = await api('/templates/');
    if(r.ok){
      var d = await r.json();
      state.templates = d.data && d.data.items ? d.data.items : (Array.isArray(d.data) ? d.data : []);
    }
  } catch(e) {
    state.templates = defaultTemplates();
  }
}

var defaultTemplates = function() {
  return [
    {id:1,name:'教师招聘2寸',width_px:413,height_px:579,dpi:350,min_kb:0,max_kb:100,physical_size_mm:'35x45mm',remark:'适用教师考编报名'},
    {id:2,name:'征兵照片',width_px:358,height_px:441,dpi:350,min_kb:20,max_kb:100,remark:'全国征兵网标准'},
    {id:3,name:'公务员1寸',width_px:295,height_px:413,dpi:350,min_kb:20,max_kb:45,physical_size_mm:'25x35mm',remark:'公务员/事业编报考'},
  ];
};

function renderTemplates(){
  var grid = $('#template-grid');
  if (!grid) return;

  // Filter out templates with 0 dimensions (like "通用扫描件")
  var validTemplates = state.templates.filter(function(t) {
    return t.width_px > 0 && t.height_px > 0;
  });

  // Render preset templates
  var html = validTemplates.map(function(t) {
    return '<div class="template-item '+(state.selectedTemplate&&state.selectedTemplate.id===t.id?'selected':'')+'" onclick="selectTemplate('+t.id+')">'+
      '<div class="tpl-name">'+t.name+'</div>'+
      '<div class="tpl-spec">'+(t.width_px||'自适应')+' x '+(t.height_px||'自适应')+'px</div>'+
      '<div class="tpl-desc">'+(t.physical_size_mm||'')+(t.remark?' · '+t.remark:'')+'</div>'+
    '</div>';
  }).join('');

  // Add custom size card (replaces the old "通用扫描件")
  var isCustomSelected = state.customSizeSelected;
  html += '<div class="template-item custom-card '+(isCustomSelected?'selected':'')+'" id="custom-size-card" onclick="selectCustomSizeCard(event)">'+
    '<div class="custom-title">自定义尺寸</div>'+
    '<div class="custom-inputs">'+
      '<input type="number" id="custom-card-width" value="'+state.customParams.width+'" placeholder="宽" min="10" max="5000" onclick="event.stopPropagation()" oninput="onCustomSizeInput()" onfocus="onCustomSizeFocus()">'+
      '<span class="unit">px</span>'+
      '<span class="sep">x</span>'+
      '<input type="number" id="custom-card-height" value="'+state.customParams.height+'" placeholder="高" min="10" max="5000" onclick="event.stopPropagation()" oninput="onCustomSizeInput()" onfocus="onCustomSizeFocus()">'+
      '<span class="unit">px</span>'+
    '</div>'+
  '</div>';

  grid.innerHTML = html;
}

function selectTemplate(id){
  state.selectedTemplate = state.templates.find(function(t){return t.id===id});
  state.customSizeSelected = false;
  state.customParams.width = '';
  state.customParams.height = '';
  renderTemplates();
}

function selectCustomSizeCard(e) {
  // e is the click event on the card
  state.customSizeSelected = true;
  state.selectedTemplate = null;
  renderTemplates();
  // Focus the width input
  setTimeout(function() {
    var w = $('#custom-card-width');
    if (w) w.focus();
  }, 50);
}

function onCustomSizeInput() {
  var w = $('#custom-card-width');
  var h = $('#custom-card-height');
  if (w) state.customParams.width = w.value;
  if (h) state.customParams.height = h.value;
  // Auto-select custom card
  if (!state.customSizeSelected) {
    state.customSizeSelected = true;
    state.selectedTemplate = null;
    renderTemplates();
  }
}

function onCustomSizeFocus() {
  if (!state.customSizeSelected) {
    state.customSizeSelected = true;
    state.selectedTemplate = null;
    renderTemplates();
  }
}

  renderHome();
}
function setGender(g){ state.customParams.gender = g; renderHome(); }

function nextStep(){
  if (state.step === 0 && !state.originalDataUrl) { toast('请先上传照片'); return; }
  state.step++;
  renderHome();
}

/* ===== PROCESS PHOTO ===== */
async function processPhoto(){
  // Validate
  if (!state.originalDataUrl) { toast('请先上传照片'); return; }

  // Check custom size card selection
  var isCustomSize = state.customSizeSelected;
  if (isCustomSize) {
    var w = $('#custom-card-width');
    var h = $('#custom-card-height');
    var cw = w ? parseInt(w.value) : 0;
    var ch = h ? parseInt(h.value) : 0;
    if (!cw || !ch || isNaN(cw) || isNaN(ch)) {
      toast('请填写自定义照片的宽度和高度');
      return;
    }
    if (cw < 10 || cw > 5000 || ch < 10 || ch > 5000) {
      toast('宽度和高度需在 10-5000px 之间');
      return;
    }
    state.customParams.width = cw;
    state.customParams.height = ch;
  }

  // Check preset mode
  if (!state.customMode && !isCustomSize && !state.selectedTemplate) {
    toast('请选择一种规格或自定义尺寸');
    return;
  }

  state.step = 3; renderHome();

  var formData = new FormData();
  var fileBlob;
  if (state.croppedDataUrl) {
    var res = await fetch(state.croppedDataUrl);
    fileBlob = await res.blob();
  } else {
    fileBlob = state.originalFile || (await fetch(state.originalDataUrl).then(function(r){return r.blob()}));
  }
  formData.append('file', fileBlob, 'photo.jpg');

  if (isCustomSize) {
    // Custom size card selected - send width/height directly
    formData.append('width', state.customParams.width);
    formData.append('height', state.customParams.height);
    formData.append('bg_color', state.bgColor);
    formData.append('beautify_level', state.beautifyLevel);
    formData.append('resize_mode', 'crop');
    formData.append('dpi', '350');
    formData.append('min_kb', '0');
    formData.append('max_kb', '100');
    formData.append('output_format', 'JPEG');
    formData.append('beautify_smooth', 'true');
    formData.append('beautify_brighten', 'true');
    formData.append('beautify_blemish', 'true');
    formData.append('upscale', 'true');
  } else if (state.selectedTemplate) {
    formData.append('template_id', state.selectedTemplate.id);
    formData.append('bg_color', state.bgColor);
    formData.append('beautify_level', state.beautifyLevel);
  } else if (state.customMode) {
    var cp = state.customParams;
    if (cp.width) formData.append('width', cp.width);
    if (cp.height) formData.append('height', cp.height);
    formData.append('resize_mode', cp.resizeMode);
    formData.append('dpi', cp.dpi);
    formData.append('min_kb', cp.minKb);
    formData.append('max_kb', cp.maxKb);
    formData.append('bg_color', cp.bgColor);
    formData.append('output_format', cp.outputFormat);
    formData.append('beautify_level', cp.beautifyLevel);
    formData.append('beautify_smooth', cp.beautifySmooth);
    formData.append('beautify_brighten', cp.beautifyBrighten);
    formData.append('beautify_blemish', cp.beautifyBlemish);
    if (cp.gender) formData.append('gender', cp.gender);
    formData.append('id_photo_align', cp.idPhotoAlign);
    formData.append('upscale', cp.upscale);
  } else {
    formData.append('bg_color', state.bgColor);
    formData.append('beautify_level', state.beautifyLevel);
  }

  try {
    var r = await api('/process/', { method: 'POST', body: formData });
    if (r.status === 402) {
      var d = await r.json();
      state.step = 2;
      showPayModal(d.order_no || d.orderNo, d.amount || d.price);
      renderHome();
      return;
    }
    if (r.ok) {
      var d = await r.json();
      state.resultUrl = d.data && d.data.result_url ? d.data.result_url : (d.data && d.data.url ? d.data.url : d.result_url);
      state.resultInfo = d.data;
      state.step = 0;
      state.originalFile = null;
      state.originalDataUrl = null;
      state.croppedDataUrl = null;
      state.selectedTemplate = null;
      state.customSizeSelected = false;
      state.customParams.width = '';
      state.customParams.height = '';
      await fetchFreeCount();
      showResultModal();
    } else {
      var err = await r.json().catch(function(){return {}});
      toast(err.detail || err.message || '处理失败');
      state.step = 2;
    }
  } catch(e) {
    toast('网络错误，请重试');
    state.step = 2;
  }
  renderHome();
}

function showPayModal(orderNo, amount) {
  showModal(
    '<h3>💎 需要付费</h3>'+
    '<div class="pay-modal"><div class="pay-amount">¥'+(amount/100).toFixed(2)+'</div></div>'+
    '<p class="text-center">免费次数已用完，请支付后继续处理</p>'+
    '<div class="qrcode-wrap" id="pay-qrcode"><div class="loading"><div class="spinner"></div><p>生成支付二维码...</p></div></div>'+
    '<div class="btn-group"><button class="btn btn-secondary btn-block" onclick="hideModal()">取消</button></div>'
  );
}

function showResultModal() {
  // Fetch preview image with auth token
  var previewUrl = state.resultUrl;
  var imgSrc = previewUrl;
  if (state.token && previewUrl) {
    fetch(previewUrl, {headers:{'Authorization':'Bearer '+state.token}})
      .then(function(r){return r.blob()})
      .then(function(blob){imgSrc = URL.createObjectURL(blob); renderModal(imgSrc)})
      .catch(function(){renderModal(previewUrl)});
  } else {
    renderModal(previewUrl);
  }
}

function renderModal(imgSrc) {
  showModal(
    '<h3>✅ 处理完成</h3>'+
    '<div style="text-align:center;margin:16px 0">'+
      '<img src="'+imgSrc+'" style="max-width:100%;max-height:400px;border-radius:var(--radius);box-shadow:var(--shadow-md)" alt="result">'+
    '</div>'+
    (state.resultInfo ?
    '<div class="meta-row"><span class="meta-label">文件大小</span><span class="meta-value">'+(state.resultInfo.file_size_kb||0).toFixed(1)+' KB</span></div>'+
    '<div class="meta-row"><span class="meta-label">像素</span><span class="meta-value">'+(state.resultInfo.pixels||'-')+'</span></div>'+
    '<div class="meta-row"><span class="meta-label">剩余次数</span><span class="meta-value">'+(state.resultInfo.remaining_free_count!==undefined?state.resultInfo.remaining_free_count:state.freeCount)+'</span></div>'
    : '')+
    '<div class="btn-group">'+
      '<button class="btn btn-primary btn-block" onclick="downloadResult()">⬇️ 下载照片</button>'+
      '<button class="btn btn-secondary btn-block" onclick="hideModal()">关闭</button>'+
    '</div>'
  );
}

async function downloadResult(){
  var downloadUrl = (state.resultInfo && state.resultInfo.download_url) || state.resultUrl;
  if (!downloadUrl) return;
  try {
    var r = await fetch(downloadUrl, {headers:{'Authorization':'Bearer '+state.token}});
    if (!r.ok) { toast('下载失败'); return; }
    var blob = await r.blob();
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'photo.jpg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('下载已开始');
  } catch(e) {
    toast('下载失败');
  }
}

/* ===== HISTORY PAGE ===== */
async function renderHistory(){
  var html = '<div class="page-header"><h1>历史记录</h1><p>最近处理过的照片</p></div>';
  try {
    var r = await api('/process/history');
    if (r.ok) {
      var d = await r.json();
      state.history = d.data && d.data.items ? d.data.items : (Array.isArray(d.data) ? d.data : []);
    }
  } catch(e) { state.history = []; }
  if (!state.history.length) {
    html += '<div class="card"><div class="empty"><span class="empty-icon">📋</span><div class="empty-title">暂无处理记录</div><div class="empty-desc">去首页上传照片开始制作</div></div></div>';
  } else {
    html += '<div class="history-list">';
    state.history.forEach(function(h) {
      var time = h.created_at ? new Date(h.created_at).toLocaleString('zh-CN') : '';
      html += '<div class="history-item" onclick="previewHistory(\''+(h.result_url||h.thumb_url)+'\')">'+
        '<div class="thumb">'+(h.thumb_url||h.result_url?'<img src="'+(h.thumb_url||h.result_url)+'" alt="thumb">':'')+'</div>'+
        '<div class="history-info"><div class="h-name">'+(h.template_name||'自定义')+'</div><div class="h-meta">'+(h.pixels||'')+' · '+(h.result_size?((h.result_size/1024).toFixed(1)+'KB'):'')+'</div><div class="h-time">'+time+'</div></div>'+
        '<span style="color:var(--muted);font-size:18px">›</span>'+
      '</div>';
    });
    html += '</div>';
  }
  $('#page-history').innerHTML = html;
}

function previewHistory(url) {
  if (!url) return;
  showModal('<div style="text-align:center"><img src="'+url+'" style="max-width:100%;max-height:70vh;border-radius:var(--radius)" alt="preview"></div><div class="btn-group"><button class="btn btn-secondary btn-block" onclick="hideModal()">关闭</button></div>');
}

/* ===== PROFILE PAGE ===== */
async function renderProfile(){
  if (!state.token) {
    $('#page-profile').innerHTML = '<div class="page-header"><h1>个人中心</h1></div><div class="card text-center"><div class="empty"><span class="empty-icon">👤</span><div class="empty-title">请先登录</div><div class="empty-desc">登录后可查看个人信息和剩余次数</div><div class="mt-20"><button class="btn btn-primary btn-lg" onclick="navigate(\'login\')">去登录</button></div></div></div>';
    return;
  }
  await fetchUser(); await fetchFreeCount();
  var html = '<div class="page-header"><h1>个人中心</h1></div>';
  html += '<div class="stat-cards">';
  html += '<div class="stat-card"><div class="stat-icon">🎁</div><div class="stat-value">'+state.freeCount+'</div><div class="stat-label">剩余免费次数</div></div>';
  html += '<div class="stat-card"><div class="stat-icon">📸</div><div class="stat-value">'+(state.history.length||0)+'</div><div class="stat-label">已处理照片</div></div>';
  html += '</div>';
  html += '<div class="card"><div class="card-title">👤 账户信息</div>';
  if (state.user) {
    html += '<div class="meta-row"><span class="meta-label">昵称</span><span class="meta-value">'+(state.user.nickname||state.user.name||'-')+'</span></div>';
    html += '<div class="meta-row"><span class="meta-label">用户ID</span><span class="meta-value">'+(state.user.id||'-')+'</span></div>';
  }
  html += '</div>';
  html += '<div class="btn-group"><button class="btn btn-danger" onclick="logout()">退出登录</button></div>';
  $('#page-profile').innerHTML = html;
}

/* ===== LOGIN PAGE ===== */
function renderLogin(){
  $('#page-login').innerHTML =
    '<div class="page-header"><h1>登录</h1><p>请登录后使用证件照处理功能</p></div>'+
    '<div class="login-card">'+
      '<div class="tab-btns">'+
        '<button class="tab-btn active" onclick="switchLoginTab(\'password\')">🔑 密码登录</button>'+
        '<button class="tab-btn" onclick="switchLoginTab(\'qrcode\')">📱 扫码登录</button>'+
      '</div>'+
      '<div id="login-password-tab">'+
        '<div class="form-group mt-20">'+
          '<label class="form-label">登录密码</label>'+
          '<input type="password" class="form-input" id="login-password" placeholder="请输入登录密码" onkeydown="if(event.key===\'Enter\')doPasswordLogin()">'+
        '</div>'+
        '<button class="btn btn-primary btn-lg btn-block mt-20" onclick="doPasswordLogin()">登 录</button>'+
        '<p class="text-muted text-center mt-12">提示：密码由管理员在 .env 中配置</p>'+
      '</div>'+
      '<div id="login-qrcode-tab" class="hidden">'+
        '<div class="qrcode-wrap" id="login-qrcode">'+
          '<p class="text-muted">点击上方按钮生成二维码</p>'+
        '</div>'+
        '<div class="login-status" id="login-status" style="display:none">'+
          '<div class="dot"></div><span>等待扫码确认...</span>'+
        '</div>'+
      '</div>'+
    '</div>';
  state.loginTab = 'password';
}

function switchLoginTab(tab){
  state.loginTab = tab;
  $$('#page-login .tab-btn').forEach(function(b) {
    b.classList.toggle('active', (tab==='password'&&b.textContent.includes('密码'))||(tab==='qrcode'&&b.textContent.includes('扫码')));
  });
  $('#login-password-tab').classList.toggle('hidden', tab!=='password');
  $('#login-qrcode-tab').classList.toggle('hidden', tab!=='qrcode');
  if (tab==='qrcode') $('#login-qrcode').innerHTML = '<p class="text-muted">选择微信或支付宝扫码登录</p>';
}

async function doPasswordLogin(){
  var pwd = $('#login-password').value;
  if (!pwd) { toast('请输入密码'); return; }
  try {
    var r = await fetch(API+'/auth/web-login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: pwd})
    });
    var d = await r.json();
    if (r.ok && (d.data && d.data.access_token || d.access_token)) {
      state.token = (d.data && d.data.access_token) || d.access_token;
      state.refreshToken = (d.data && d.data.refresh_token) || d.refresh_token || '';
      localStorage.setItem(TOKEN_KEY, state.token);
      localStorage.setItem(REFRESH_KEY, state.refreshToken);
      await fetchUser(); await fetchFreeCount();
      toast('登录成功');
      navigate('home');
    } else {
      toast(d.detail || '登录失败，请检查密码');
    }
  } catch(e) { toast('网络错误'); }
}

async function startLogin(type){
  $$('#page-login .tab-btn').forEach(function(b){b.classList.toggle('active',b.textContent.includes(type==='wechat'?'微信':'支付宝'))});
  $('#login-qrcode').innerHTML = '<div class="loading"><div class="spinner"></div><p>生成二维码...</p></div>';
  clearInterval(state.qrcodePolling);
  var endpoint = type==='wechat'?'/auth/wechat-web-qrcode':'/auth/alipay-web-qrcode';
  var cbEndpoint = type==='wechat'?'/auth/wechat-web-callback':'/auth/alipay-web-callback';
  try {
    var r = await fetch(API+endpoint, {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    if (!r.ok) { toast('获取二维码失败'); return; }
    var d = await r.json();
    var stateKey = (d.data && d.data.state) || d.state || '';
    var qrUrl = (d.data && d.data.qrcode_url) || (d.data && d.data.code_url) || d.qrcode_url || '';
    if (!qrUrl) { toast('获取二维码失败'); return; }
    renderQRCode(qrUrl);
    $('#login-status').style.display = 'flex';
    state.qrcodePolling = setInterval(async function() {
      try {
        var pr = await fetch(API+cbEndpoint, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:stateKey,action:'polling'})});
        if (pr.ok) {
          var pd = await pr.json();
          if ((pd.data && pd.data.access_token) || pd.access_token) {
            clearInterval(state.qrcodePolling);
            state.token = (pd.data && pd.data.access_token) || pd.access_token;
            state.refreshToken = (pd.data && pd.data.refresh_token) || pd.refresh_token || '';
            localStorage.setItem(TOKEN_KEY, state.token); localStorage.setItem(REFRESH_KEY, state.refreshToken);
            await fetchUser(); await fetchFreeCount();
            toast('登录成功');
            navigate('home');
          }
        }
      } catch(e) {}
    }, 2000);
  } catch(e) { toast('网络错误'); }
}

function renderQRCode(url){
  var container = $('#login-qrcode');
  if (!container) return;
  container.innerHTML = '';
  var canvas = document.createElement('canvas');
  canvas.width = 200; canvas.height = 200;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,200,200);
  ctx.fillStyle = '#1a1a2e';
  var size = 10; var margin = 20; var cols = 16;
  for (var r=0; r<cols; r++) for (var c=0; c<cols; c++) {
    if (Math.random()>0.5) { ctx.fillRect(margin+c*size, margin+r*size, size-2, size-2); }
  }
  function drawMarker(x,y){
    ctx.fillRect(x,y,30,30); ctx.fillStyle='#fff'; ctx.fillRect(x+5,y+5,20,20); ctx.fillStyle='#1a1a2e'; ctx.fillRect(x+10,y+10,10,10);
  }
  drawMarker(margin,margin); drawMarker(margin+130,margin); drawMarker(margin,margin+130);
  container.appendChild(canvas);
  var link = document.createElement('a');
  link.href = url; link.textContent = '点击在手机浏览器打开'; link.target = '_blank';
  link.style.cssText = 'display:block;margin-top:8px;font-size:12px;color:var(--accent)';
  container.appendChild(link);
}

/* ===== INIT ===== */
async function init(){
  if (state.token) {
    await fetchUser();
    await fetchFreeCount();
    await loadTemplates();
    navigate('home');
  } else {
    navigate('login');
  }
}
init();
</script>
