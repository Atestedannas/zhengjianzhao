name: Deploy to production

# push 到 main 就自动部署；也可以在 Actions 页面点 “Run workflow” 手动触发
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# 同一个时间只跑一次部署，避免连续两次 push 同时重建
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 同步代码 → 重建后端 → 重启容器
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # ServerAliveInterval/CountMax + TCPKeepAlive：每 30s 发心跳，避免空闲被中间设备掐断
          ssh -i ~/.ssh/id_deploy -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            -o TCPKeepAlive=yes \
            "$SSH_USER@$SSH_HOST" 'echo "SSH 连通，服务器主机名：$(hostname)"'

      - name: 同步文件到服务器
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          # 用仓库里的排除清单保护服务器上的 .env 和大模型文件；不使用 --delete，
          # 所以服务器上已有的文件永远不会被删掉。
          # --partial --inplace --timeout：单文件传输中断可续传，避免大模型文件半途失败
          rsync -rlptzv --no-owner --no-group \
            --partial --inplace --timeout=300 \
            --exclude-from=deploy/rsync-exclude.txt \
            -e "ssh -i ~/.ssh/id_deploy -p $PORT -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o TCPKeepAlive=yes" \
            ./ "$SSH_USER@$SSH_HOST:/opt/zhengjianzhao/photo-zhijianzhao/"

      - name: 服务器上重建并重启
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          # nohup 让 deploy.sh 脱离 SSH 会话在服务器上独立运行：
          #   即使 Actions 的 SSH 断了，服务器上的 docker build 也不会被带走。
          # 随后每 15 秒输出一次心跳 + 日志尾部，保持 SSH 通道有流量，双保险。
          ssh -i ~/.ssh/id_deploy -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            -o TCPKeepAlive=yes \
            "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/zhengjianzhao/photo-zhijianzhao
          nohup bash deploy/deploy.sh > /tmp/deploy.log 2>&1 < /dev/null &
          PID=$!
          echo "==> deploy.sh PID=$PID，开始跟随日志"
          while kill -0 "$PID" 2>/dev/null; do
            sleep 15
            echo "--- 心跳 $(date -u '+%T') UTC ---"
            tail -n 5 /tmp/deploy.log || true
          done
          wait "$PID"
          EXIT=$?
          echo "==> deploy.sh 退出码：$EXIT"
          echo "===== 最终日志（末尾 100 行）====="
          tail -n 100 /tmp/deploy.log || true
          exit $EXIT
          REMOTE

      - name: 结果摘要
        if: always()
        run: |
          {
            echo "### 部署${{ job.status == 'success' && '成功' || '失败' }}"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| 分支 | \`${{ github.ref_name }}\` |"
            echo "| 触发 | ${{ github.event_name }} |"
            echo "| 时间 | $(date -u '+%Y-%m-%d %H:%M:%S') UTC |"
          } >> "$GITHUB_STEP_SUMMARY"
