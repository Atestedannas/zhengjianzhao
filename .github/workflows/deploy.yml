name: Deploy to production

# push 到 main 就自动部署；也可以在 Actions 页面点 “Run workflow” 手动触发
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# 同一个时间只跑一次部署，避免连续两次 push 同时重建
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 服务器 git pull → 按需重建 → 重启容器
    runs-on: ubuntu-latest
    # 代码改由服务器自己 git pull（只传差异），apt 换源修复后一次构建约 2~3 分钟；
    # 日常部署只是 restart（秒级），20 分钟余量充足。
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # ServerAliveInterval/CountMax + TCPKeepAlive：每 30s 发心跳，避免空闲被中间设备掐断
          ssh -i ~/.ssh/id_deploy -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            -o TCPKeepAlive=yes \
            "$SSH_USER@$SSH_HOST" 'echo "SSH 连通，服务器主机名：$(hostname)"'

      - name: 通知服务器 git pull 并部署
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          # 代码由服务器自己 git pull 拉取（只传差异，比 rsync 全量同步快得多，
          # 也没有整目录传输中途断连的风险）。.env / 模型文件不在 git 里，pull 不会动它们。
          # nohup 让部署脚本脱离 SSH 会话在服务器上独立运行：
          #   即使 Actions 的 SSH 断了，服务器上的部署也不会被带走。
          # 随后每 15 秒输出一次心跳 + 日志尾部，保持 SSH 通道有流量，双保险。
          ssh -i ~/.ssh/id_deploy -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            -o TCPKeepAlive=yes \
            "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/zhengjianzhao/photo-zhijianzhao
          nohup bash deploy/git-pull-deploy.sh > /tmp/deploy.log 2>&1 < /dev/null &
          PID=$!
          echo "==> 部署进程 PID=$PID，开始跟随日志"
          while kill -0 "$PID" 2>/dev/null; do
            sleep 15
            echo "--- 心跳 $(date -u '+%T') UTC ---"
            tail -n 5 /tmp/deploy.log || true
          done
          wait "$PID"
          EXIT=$?
          echo "==> 部署退出码：$EXIT"
          echo "===== 最终日志（末尾 100 行）====="
          tail -n 100 /tmp/deploy.log || true
          exit $EXIT
          REMOTE

      - name: 结果摘要
        if: always()
        run: |
          {
            echo "### 部署${{ job.status == 'success' && '成功' || '失败' }}"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| 分支 | \`${{ github.ref_name }}\` |"
            echo "| 触发 | ${{ github.event_name }} |"
            echo "| 时间 | $(date -u '+%Y-%m-%d %H:%M:%S') UTC |"
          } >> "$GITHUB_STEP_SUMMARY"
