name: Deploy to production

# push 到 main 就自动部署；也可以在 Actions 页面点 “Run workflow” 手动触发
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# 同一个时间只跑一次部署，避免连续两次 push 同时重建
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 服务器 git pull → 按需重建 → 重启容器
    runs-on: ubuntu-latest
    # 代码改由服务器自己 git pull（只传差异），apt 换源修复后一次构建约 2~3 分钟；
    # 日常部署只是 restart（秒级），20 分钟余量充足。
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 必须完整克隆：默认 depth=1 的浅克隆无法 git push 到服务器
          # （服务器拒绝 shallow update，2026-11-12 踩坑）
          fetch-depth: 0

      - name: 配置 SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # ServerAliveInterval/CountMax + TCPKeepAlive：每 30s 发心跳，避免空闲被中间设备掐断
          ssh -i ~/.ssh/id_deploy -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            -o TCPKeepAlive=yes \
            "$SSH_USER@$SSH_HOST" 'echo "SSH 连通，服务器主机名：$(hostname)"'

      - name: 服务器准备（自愈权限 + 允许 push 更新工作区）
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -e
          cd /opt/zhengjianzhao/photo-zhijianzhao
          echo "==> 部署用户：$(id)"
          # 自愈：工作区可能残留经 1Panel 上传的 root 属主文件或 immutable 属性，
          # 会让 git 更新工作区报 "unable to unlink ... Permission denied"（2026-11-12 踩坑）。
          # 部署用户是非 root（uid=1000，在 sudo 组），修复必须走 sudo -n。
          SUDO=""
          if sudo -n true 2>/dev/null; then SUDO="sudo -n"; fi
          $SUDO chattr -R -i . 2>/dev/null || true
          $SUDO chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
          chmod -R u+rwX . 2>/dev/null || true
          # 允许 Actions 直接 git push 到本仓库并同步更新工作区：
          # 服务器到 github.com 的网络不稳定（多次部署失败根因），
          # 改为由 Actions 构建机（GitHub 侧网络好）推代码过来。
          git config receive.denyCurrentBranch updateInstead
          # 清理上次失败遗留的半更新工作区
          git reset --hard HEAD
          # 服务器 main 可能有本地私有提交（与 GitHub 分叉），push 前留备份分支再强推
          echo "==> 服务器 main 当前指向：$(git rev-parse main 2>/dev/null || echo none)"
          git log --oneline -3 main 2>/dev/null || true
          git branch -f "backup/before-push-$(date +%Y%m%d-%H%M%S)" main 2>/dev/null || true
          echo "==> 服务器准备完成，HEAD=$(git rev-parse --short HEAD)"
          REMOTE

      - name: 推送代码到服务器并部署
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          # push 模式：Actions 构建机直接推代码到服务器仓库（updateInstead 自动更新工作区），
          # .env / 模型文件不在 git 里，push 不会动它们。
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_deploy -p $PORT -o StrictHostKeyChecking=accept-new"
          echo "==> 推送 $(git rev-parse --short HEAD) 到服务器"
          # --force：服务器 main 可能有本地私有提交（准备阶段已留 backup/before-push-* 分支）
          git push --force "ssh://$SSH_USER@$SSH_HOST/opt/zhengjianzhao/photo-zhijianzhao" HEAD:main
          # nohup 让部署脚本脱离 SSH 会话在服务器上独立运行：
          #   即使 Actions 的 SSH 断了，服务器上的部署也不会被带走。
          # 随后每 15 秒输出一次心跳 + 日志尾部，保持 SSH 通道有流量，双保险。
          ssh -i ~/.ssh/id_deploy -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=120 \
            -o TCPKeepAlive=yes \
            "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/zhengjianzhao/photo-zhijianzhao
          nohup bash deploy/deploy.sh > /tmp/deploy.log 2>&1 < /dev/null &
          PID=$!
          echo "==> 部署进程 PID=$PID，开始跟随日志"
          while kill -0 "$PID" 2>/dev/null; do
            sleep 15
            echo "--- 心跳 $(date -u '+%T') UTC ---"
            tail -n 5 /tmp/deploy.log || true
          done
          wait "$PID"
          EXIT=$?
          echo "==> 部署退出码：$EXIT"
          echo "===== 最终日志（末尾 100 行）====="
          tail -n 100 /tmp/deploy.log || true
          exit $EXIT
          REMOTE

      - name: 结果摘要
        if: always()
        run: |
          {
            echo "### 部署${{ job.status == 'success' && '成功' || '失败' }}"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| 分支 | \`${{ github.ref_name }}\` |"
            echo "| 触发 | ${{ github.event_name }} |"
            echo "| 时间 | $(date -u '+%Y-%m-%d %H:%M:%S') UTC |"
          } >> "$GITHUB_STEP_SUMMARY"
