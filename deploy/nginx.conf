# ============================================================
# 照片合规处理系统 — Nginx 配置
# 功能：HTTPS卸载、反向代理、静态资源、限流、CORS
# ============================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/octet-stream;

    # 限流配置
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 上游后端服务
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # 根路径流量分发：手机/平板/微信内置浏览器 → 移动端 H5，其余 → PC 专版
    map $http_user_agent $site_entry {
        default                                                          /web-pc/;
        "~*(Android|iPhone|iPod|iPad|Mobile|MicroMessenger|HarmonyOS)"    /m/;
    }

    # ======================== HTTP → HTTPS 重定向 ========================
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ======================== HTTPS 主服务 ========================
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL 证书（生产环境使用实际证书路径）
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS（生产环境启用）
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # 上传文件大小限制
        client_max_body_size 10m;
        client_body_buffer_size 128k;

        # ======================== 管理后台静态资源 ========================
        location ^~ /admin/ {
            alias /usr/share/nginx/admin/;
            try_files $uri $uri/ /admin/index.html;
            index index.html;
        }

        location = /admin {
            return 302 /admin/;
        }

        # ======================== PC 专版（独立链接，PC 完美适配） ========================
        location = /web-pc {
            return 302 /web-pc/;
        }

        location ^~ /web-pc/ {
            root /usr/share/nginx;
            try_files $uri $uri/ /web-pc/index.html;
            index index.html;
        }

        # ======================== 移动端 H5 用户端 ========================
        # uni-app H5 构建（base=/m/），供手机/平板/微信内置浏览器访问
        location ^~ /m/ {
            root /usr/share/nginx;
            try_files $uri $uri/ /m/index.html;
            index index.html;
        }

        # ======================== 旧版单文件桌面页（保留备份入口） ========================
        location ^~ /web/ {
            root /usr/share/nginx;
            try_files $uri $uri/ /web/index.html;
            index index.html;
        }

        # ======================== 根路径：按设备分流 ========================
        # PC/桌面 → /web-pc/，手机/平板/微信 → /m/
        location / {
            return 302 $site_entry;
        }

        location = /favicon.ico {
            return 204;
        }

        # ======================== API 反向代理 ========================
        location /api/ {
            # 限流
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;

            # 大文件上传特殊处理
            location /api/v1/process {
                proxy_read_timeout 90s;
            }
        }

        # ======================== 健康检查 ========================
        # 后端真实路由是 /health（不在 /api/v1 下），写错会一直 404
        location /health {
            proxy_pass http://backend/health;
            access_log off;
        }
    }
}