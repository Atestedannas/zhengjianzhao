# ============================================================
# 照片合规处理系统 — 1Panel Nginx 配置
# 前端静态文件 + API 反向代理（SSL 由 1Panel OpenResty 处理）
#
# 站点分工（各入口相互独立，互不干扰）：
#   /          按设备分流：PC/桌面 → /web-pc/，手机/平板/微信 → /m/
#   /web-pc/   PC 专版（Vue3 + Element Plus，PC 完美适配，独立链接）
#   /m/        移动端 H5 用户端（uni-app 构建，base=/m/）
#   /web/      旧版单文件桌面页（保留备份入口，未在站内导航）
#   /admin/    管理后台
# ============================================================

# 根路径流量分发：手机/平板/微信内置浏览器 → 移动端 H5，其余 → PC 专版
map $http_user_agent $site_entry {
    default                                                          /web-pc/;
    "~*(Android|iPhone|iPod|iPad|Mobile|MicroMessenger|HarmonyOS)"    /m/;
}

server {
    listen 80;
    server_name _;

    # 禁止绝对路径重定向（避免丢失端口号）
    absolute_redirect off;

    # 上传文件大小限制
    client_max_body_size 10m;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # ======================== 根路径：按设备分流 ========================
    # /web/、/web-pc/、/admin/、/api/ 都是更精确的前缀匹配，不会走到这里
    location / {
        return 302 $site_entry;
    }

    location = /favicon.ico {
        return 204;
    }

    # ======================== PC 专版（独立链接，PC 完美适配） ========================
    # 精确匹配无斜杠的 /web-pc：用相对路径 302 跳转，保留端口号
    location = /web-pc {
        return 302 /web-pc/;
    }

    location /web-pc/ {
        root /usr/share/nginx;
        index index.html;
        try_files $uri $uri/ /web-pc/index.html;
    }

    # ======================== 移动端 H5 用户端 ========================
    # uni-app H5 构建（base=/m/），供手机/平板/微信内置浏览器访问
    location /m/ {
        root /usr/share/nginx;
        index index.html;
        try_files $uri $uri/ /m/index.html;
    }

    # ======================== 旧版单文件桌面页（保留备份入口） ========================
    location /web/ {
        root /usr/share/nginx;
        index index.html;
        try_files $uri $uri/ /web/index.html;
    }

    # ======================== 管理后台 ========================
    location /admin/assets/ {
        alias /usr/share/nginx/admin/assets/;
    }

    # 精确匹配无斜杠的 /admin：用相对路径 302 跳转，保留端口号
    # （否则 nginx 目录索引 301 会用容器内 80 端口生成绝对 URL，丢失外部 8081）
    location = /admin {
        return 302 /admin/;
    }

    location /admin/ {
        root /usr/share/nginx;
        try_files $uri $uri/ /admin/index.html;
        index index.html;
        sub_filter_once on;
        sub_filter 'src="/assets/' 'src="/admin/assets/';
        sub_filter 'href="/assets/' 'href="/admin/assets/';
    }

    # ======================== API 反向代理 ========================
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ======================== 健康检查 ========================
    # 后端真实路由是 /health（不在 /api/v1 下），写错会一直 404
    location /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }
}
