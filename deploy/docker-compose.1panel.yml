# ============================================================
# 照片合规处理系统 — 1Panel 专用 Docker Compose
# 复用现有 MySQL / Redis / OpenResty，只部署后端
# 使用绝对路径（1Panel 会将 compose 文件复制到内部目录执行）
# 项目路径: /opt/zhengjianzhao/photo-zhijianzhao
# 部署方式: 在 1Panel → 容器 → 编排 中粘贴此文件
#
# 【部署模型】代码和模型都从宿主机只读挂载，不烤进镜像：
#     backend/app     -> /app/app      改 Python 只需重启容器（秒级，无需 build）
#     backend/models  -> /app/models   约 640MB 模型，改模型只需换文件 + 重启
#   只有 requirements.txt / Dockerfile 变了才需要 docker compose build。
# ============================================================

services:
  # ======================== FastAPI 后端 ========================
  backend:
    build:
      context: /opt/zhengjianzhao/photo-zhijianzhao/backend
      dockerfile: Dockerfile
    container_name: photo-backend
    restart: unless-stopped
    # -w 2：单机内存小，worker 越少越安全（重活已经交给 celery，这里只处理请求）；
    # --max-requests：处理 N 个请求后回收 worker，把可能残留的缓冲内存还给系统
    command: gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --timeout 300 --graceful-timeout 30 --keep-alive 5 --max-requests 5 --max-requests-jitter 2 --access-logfile - --error-logfile -
    env_file:
      - /opt/zhengjianzhao/photo-zhijianzhao/backend/.env
    volumes:
      # 代码只读挂载：改 Python 不用重建镜像，重启容器即生效
      - /opt/zhengjianzhao/photo-zhijianzhao/backend/app:/app/app:ro
      # 模型只读挂载：u2net / BiRefNet / face_landmarker / face_parsing 全在这里，
      # 代码统一从 /app/models 解析（background.py 的 _model_candidates 第三候选）
      - /opt/zhengjianzhao/photo-zhijianzhao/backend/models:/app/models:ro
      # 模板配置（启动时 init_templates 读 presets.yaml），挂了改模板就不用 rebuild
      - /opt/zhengjianzhao/photo-zhijianzhao/backend/templates_config:/app/templates_config:ro
      - photo_temp:/data/temp
      - photo_uploads:/data/uploads
    ports:
      - "8800:8000"
    healthcheck:
      # 后端真实路由是 /health（不在 /api/v1 下）
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - 1panel-network
      - photo-net

  # ======================== Celery Worker（异步任务） ========================
  celery-worker:
    build:
      context: /opt/zhengjianzhao/photo-zhijianzhao/backend
      dockerfile: Dockerfile
    container_name: photo-celery-worker
    restart: unless-stopped
    # -c 1：同一时间只跑一个图像处理（单个模型峰值可达 1~3GB，并发就是 OOM）；
    # --max-tasks-per-child 20：跑一定数量后重启子进程，把模型内存彻底还给系统
    command: celery -A app.tasks.celery_app worker -l info -c 1 --max-tasks-per-child 20
    env_file:
      - /opt/zhengjianzhao/photo-zhijianzhao/backend/.env
    volumes:
      # 出图只发生在 worker 里，所以代码和模型这里也必须挂，缺一个就是「一直处理中 → 失败」
      - /opt/zhengjianzhao/photo-zhijianzhao/backend/app:/app/app:ro
      - /opt/zhengjianzhao/photo-zhijianzhao/backend/models:/app/models:ro
      - /opt/zhengjianzhao/photo-zhijianzhao/backend/templates_config:/app/templates_config:ro
      - photo_temp:/data/temp
      - photo_uploads:/data/uploads
    networks:
      - 1panel-network
      - photo-net

  # ======================== Celery Beat（定时任务） ========================
  celery-beat:
    build:
      context: /opt/zhengjianzhao/photo-zhijianzhao/backend
      dockerfile: Dockerfile
    container_name: photo-celery-beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat -l info
    env_file:
      - /opt/zhengjianzhao/photo-zhijianzhao/backend/.env
    volumes:
      - /opt/zhengjianzhao/photo-zhijianzhao/backend/app:/app/app:ro
      - photo_temp:/data/temp
      - photo_uploads:/data/uploads
    networks:
      - 1panel-network
      - photo-net

  # ======================== Nginx（前端静态 + API 反向代理） ========================
  nginx:
    image: nginx:1.25-alpine
    container_name: photo-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - /opt/zhengjianzhao/photo-zhijianzhao/deploy/nginx-1panel.conf:/etc/nginx/conf.d/default.conf:ro
      # 移动端 H5 用户端（uni-app 构建，base=/m/）→ /m/
      - /opt/zhengjianzhao/photo-zhijianzhao/frontend/dist/build/h5:/usr/share/nginx/m:ro
      # 旧版单文件桌面页 → /web/（保留备份入口）
      - /opt/zhengjianzhao/photo-zhijianzhao/frontend/web:/usr/share/nginx/web:ro
      # PC 专版（Vue3 构建，base=/web-pc/）→ /web-pc/（独立链接）
      - /opt/zhengjianzhao/photo-zhijianzhao/web-pc/dist:/usr/share/nginx/web-pc:ro
      # 管理后台 → /admin/
      - /opt/zhengjianzhao/photo-zhijianzhao/admin/dist:/usr/share/nginx/admin:ro
    depends_on:
      - backend
    networks:
      - photo-net

# ======================== 数据卷 ========================
# 注意：模型不再用命名卷（photo_models 已废弃）——命名卷在空的时候会从镜像里
# 复制内容，改了模型文件很难感知；改成宿主机目录绑定挂载后「看到什么就是什么」。
volumes:
  photo_temp:
    driver: local
  photo_uploads:
    driver: local

# ======================== 网络 ========================
networks:
  # 加入 1Panel 现有网络，使容器可访问 Mysql/Redis
  1panel-network:
    external: true
    name: 1panel-network
  # 后端内部网络（backend ↔ celery ↔ nginx）
  photo-net:
    driver: bridge
