# ============================================================
# Celery Beat 定时任务配置
# 通过 systemd 或 supervisor 管理 Celery Beat 进程
# ============================================================

# 定时任务调度频率（秒）
# 注意：beat 调度器每 60 秒检查一次是否有待执行的任务
CELERYBEAT_SCHEDULE_INTERVAL=60

# 日志级别
CELERYBEAT_LOG_LEVEL=INFO

# 日志文件路径
CELERYBEAT_LOG_FILE=/var/log/photo-service/celery-beat.log

# PID 文件
CELERYBEAT_PID_FILE=/var/run/celery-beat.pid

# 工作目录
CELERYBEAT_WORK_DIR=/app

# 启动命令
# celery -A app.tasks.celery_app beat -l info --pidfile=/var/run/celery-beat.pid --logfile=/var/log/photo-service/celery-beat.log

# ============================================================
# systemd 服务文件示例: /etc/systemd/system/photo-celery-beat.service
# ============================================================
# [Unit]
# Description=Photo Service Celery Beat Scheduler
# After=network.target redis.service
#
# [Service]
# Type=simple
# User=www-data
# Group=www-data
# WorkingDirectory=/app
# EnvironmentFile=/app/.env
# ExecStart=/usr/local/bin/celery -A app.tasks.celery_app beat -l info
# Restart=always
# RestartSec=10
# StandardOutput=append:/var/log/photo-service/celery-beat.log
# StandardError=append:/var/log/photo-service/celery-beat-error.log
#
# [Install]
# WantedBy=multi-user.target

# ============================================================
# systemd 服务文件示例: /etc/systemd/system/photo-celery-worker.service
# ============================================================
# [Unit]
# Description=Photo Service Celery Worker
# After=network.target redis.service
#
# [Service]
# Type=simple
# User=www-data
# Group=www-data
# WorkingDirectory=/app
# EnvironmentFile=/app/.env
# ExecStart=/usr/local/bin/celery -A app.tasks.celery_app worker -l info -c 2 --max-tasks-per-child 100
# Restart=always
# RestartSec=10
# StandardOutput=append:/var/log/photo-service/celery-worker.log
# StandardError=append:/var/log/photo-service/celery-worker-error.log
#
# [Install]
# WantedBy=multi-user.target